[package]
name = "bridge-daemon"
version = "0.1.0"
edition = "2021"
description = "Bridge desktop daemon — discovery, pairing, transport, services"

[[bin]]
name = "bridge-daemon"
path = "src/main.rs"

[dependencies]
bridge-core = { path = "../bridge-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
mdns-sd = "0.13"
keyring = "3"
directories = "6"
qrcode = { version = "0.14", features = ["svg"] }
quinn = { version = "0.11", features = ["rustls-ring"] }
rustls = "0.23"
rcgen = "0.13"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
gethostname = "0.4"
hex = "0.4"
